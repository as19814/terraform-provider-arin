name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git unzip python3
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure container Git workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false
      - name: Check Go formatting
        run: test -z "$(gofmt -l main.go internal tools)"
      - name: Scan Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git . --log-opts="--all --full-history" --redact --ignore-gitleaks-allow
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive examples
      - name: Check dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet, unit tests, fake-server acceptance tests, and build
        run: make check
      - name: Verify generated documentation
        run: |
          go generate ./...
          git diff --exit-code -- docs examples
          test -z "$(git ls-files --others --exclude-standard docs examples)"
      - name: Check provider schema compatibility baseline
        run: python3 scripts/check-schema.py
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
