name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, yyj]
    container:
      image: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git unzip
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure container Git workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false
      - name: Check Go formatting
        run: test -z "$(gofmt -l main.go internal tools)"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive examples
      - name: Check dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet, unit tests, fake-server acceptance tests, and build
        run: make check
      - name: Verify generated documentation
        run: |
          go generate ./...
          git diff --exit-code -- docs examples
          test -z "$(git ls-files --others --exclude-standard docs examples)"
