name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version, for example 0.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    timeout-minutes: 25
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git unzip python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure container Git workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false
      - name: Scan Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git . --log-opts="--all --full-history" --redact --ignore-gitleaks-allow
      - name: Verify candidate
        run: |
          test -z "$(gofmt -l main.go internal tools)"
          terraform fmt -check -recursive examples
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make check
          make checkschema vuln
          go generate ./...
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard docs examples)"
      - name: Build candidate archives
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: python3 scripts/package-provider.py "$CANDIDATE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
